name: Release Multiplataforma

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências (Root)
        run: npm ci || npm install

      - name: Instalar dependências (Renderer)
        run: npm --prefix renderer ci || npm --prefix renderer install

      - name: Compilar e Empacotar Aplicação
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:${{ matrix.target }}

      - name: Publicar Arquivos na Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/latest*.yml
            dist-electron/*.blockmap
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configurar Android SDK e Licenças
        run: |
          echo "sdk.dir=$ANDROID_HOME" > renderer/android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Instalar dependências (Root)
        run: npm ci || npm install

      - name: Instalar dependências (Renderer)
        run: npm --prefix renderer ci || npm --prefix renderer install

      - name: Compilar Frontend (Renderer)
        run: npm --prefix renderer run build

      - name: Sincronizar Capacitor Android
        env:
          CAPACITOR_TELEMETRY: "0"
        run: |
          mkdir -p ~/.config/capacitor
          mkdir -p renderer/android/app/src/main/assets/public
          cp -r renderer/dist/* renderer/android/app/src/main/assets/public/
          cd renderer && npx @capacitor/cli sync android --no-telemetry || true

      - name: Compilar APK com Gradle
        run: |
          cd renderer/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info

      - name: Organizar e Renomear APK
        run: |
          mkdir -p dist-mobile
          VERSION_TAG="${{ github.ref_name }}"
          if [ -z "$VERSION_TAG" ]; then
            VERSION_TAG="v1.5.0"
          fi
          cp renderer/android/app/build/outputs/apk/debug/app-debug.apk dist-mobile/Gringotts-${VERSION_TAG}-android.apk

      - name: Publicar APK na Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist-mobile/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar Artefato de Build
        uses: actions/upload-artifact@v4
        with:
          name: Gringotts-Android-APK
          path: dist-mobile/*.apk
